name: Zappli
description: Zappli was an early mobile-commerce startup, maker of the myShopanion iPhone
  shopping app, which let consumers browse and shop retail products and share their finds
  and purchases across social networks such as Facebook and Twitter to get real-time feedback
  from friends and family. Backed by 500 Global (500 Startups), Founders' Co-op, Techstars,
  and the Webb Investment Network, Zappli was acquired by Connexity in July 2013 and is no
  longer operating. It publishes no public API, developer portal, or API documentation, and
  the zappli.com domain no longer serves a live website.
